openapi: 3.0.3
info:
  title: Simple E-commerce Store API
  version: 1.0.0
paths:
  /api/products:
    get:
      summary: Discover active products
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Brand'
        - $ref: '#/components/parameters/Subcategory'
        - $ref: '#/components/parameters/Featured'
        - $ref: '#/components/parameters/Sale'
        - $ref: '#/components/parameters/MinPrice'
        - $ref: '#/components/parameters/MaxPrice'
        - $ref: '#/components/parameters/InStock'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Matching active products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/orders:
    get:
      summary: List the authenticated customer's orders
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Customer order history, including cancelled orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create an order
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/orders/{orderId}:
    get:
      summary: Get an owned order
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/orders/{orderId}/cancel:
    post:
      summary: Cancel an eligible owned order
      description: Cancellation restores recorded order-item quantities and order metadata atomically. Repeated requests are idempotent.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Cancelled order or an already-cancelled idempotent result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Q:
      name: q
      in: query
      schema: { type: string, maxLength: 200 }
      description: Whitespace-separated terms; every term must match a meaningful product field.
    Category:
      name: category
      in: query
      schema: { type: string, maxLength: 255 }
    Brand:
      name: brand
      in: query
      schema: { type: string, maxLength: 255 }
    Subcategory:
      name: subcategory
      in: query
      schema: { type: string, maxLength: 255 }
    Featured:
      name: featured
      in: query
      schema: { type: boolean }
    Sale:
      name: sale
      in: query
      schema: { type: boolean }
    MinPrice:
      name: min_price
      in: query
      schema: { type: number, format: double, minimum: 0 }
    MaxPrice:
      name: max_price
      in: query
      schema: { type: number, format: double, minimum: 0 }
    InStock:
      name: in_stock
      in: query
      schema: { type: boolean }
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [id_asc, newest, oldest, price_asc, price_desc, name_asc, name_desc, featured]
        default: id_asc
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque cursor returned as pagination.nextCursor; reuse only with the same filters and sort.
  responses:
    BadRequest:
      description: Invalid query parameter or cursor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Order not found or not owned by the authenticated customer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Order is not cancellable in its current status
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateOrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: integer, format: int64, minimum: 1 }
              quantity: { type: integer, minimum: 1 }
        shipping:
          type: object
          additionalProperties: true
        payment:
          $ref: '#/components/schemas/PaymentSelection'
    PaymentSelection:
      type: object
      properties:
        method:
          type: string
          enum: [CASH_ON_DELIVERY, CARD, MOBILE_BANKING]
          default: CASH_ON_DELIVERY
        provider:
          type: string
          nullable: true
          enum: [VISA, MASTERCARD, BKASH, NAGAD, null]
    CancelOrderRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    OrderListEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [orders]
          properties:
            orders:
              type: array
              items:
                $ref: '#/components/schemas/Order'
    OrderEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [order]
          properties:
            order:
              $ref: '#/components/schemas/Order'
    CancelOrderEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          type: object
          required: [order, already_cancelled]
          properties:
            order:
              $ref: '#/components/schemas/Order'
            already_cancelled: { type: boolean }
    Order:
      type: object
      required: [id, userId, totalAmount, status, createdAt, paymentStatus]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        totalAmount: { type: number, format: double }
        status:
          type: string
          enum: [pending, confirmed, processing, shipped, delivered, completed, cancelled]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        estimatedDeliveryFrom: { type: string, format: date, nullable: true }
        estimatedDeliveryTo: { type: string, format: date, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancelledByUserId: { type: integer, format: int64, nullable: true }
        cancellationReason: { type: string, nullable: true }
        paymentMethod:
          type: string
          nullable: true
          enum: [CASH_ON_DELIVERY, CARD, MOBILE_BANKING, null]
        paymentStatus:
          type: string
          enum: [PENDING, AUTHORIZED, PAID, FAILED, CANCELLED]
        paymentProvider:
          type: string
          nullable: true
          enum: [VISA, MASTERCARD, BKASH, NAGAD, null]
        shippingName: { type: string, nullable: true }
        shippingEmail: { type: string, nullable: true }
        shippingPhone: { type: string, nullable: true }
        shippingAddressLine1: { type: string, nullable: true }
        shippingAddressLine2: { type: string, nullable: true }
        shippingCity: { type: string, nullable: true }
        shippingState: { type: string, nullable: true }
        shippingPostalCode: { type: string, nullable: true }
        shippingCountry: { type: string, nullable: true }
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    OrderItem:
      type: object
      required: [id, productId, quantity, unitPrice, subtotal]
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        productName: { type: string, nullable: true }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number, format: double }
        subtotal: { type: number, format: double }
        rating: { type: integer, minimum: 1, maximum: 5, nullable: true }
        ratedAt: { type: string, format: date-time, nullable: true }
    ProductListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        pagination:
          $ref: '#/components/schemas/Pagination'
    Product:
      type: object
      required: [id, name, price, stock_quantity, is_active, is_featured, offer_sale]
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: Wireless Mouse }
        slug: { type: string, nullable: true }
        sku: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        category: { type: string, nullable: true }
        subcategory: { type: string, nullable: true }
        description: { type: string, nullable: true }
        short_description: { type: string, nullable: true }
        price: { type: number, format: double, example: 25.99 }
        regular_price: { type: number, format: double, nullable: true }
        offer_price: { type: number, format: double, nullable: true }
        offer_sale: { type: boolean }
        image_url: { type: string, nullable: true }
        stock_quantity: { type: integer, minimum: 0 }
        low_stock_threshold: { type: integer, minimum: 0 }
        is_active: { type: boolean }
        is_featured: { type: boolean }
        colors: { type: array, items: { type: string } }
        sizes: { type: array, items: { type: string } }
        variant: { type: string, nullable: true }
        specifications: { type: object, additionalProperties: true }
        vendor: { type: string, nullable: true }
        made_in: { type: string, nullable: true }
        barcode: { type: string, nullable: true }
        weight: { type: number, format: double, nullable: true }
        unit: { type: string, nullable: true }
        material: { type: string, nullable: true }
        warranty: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        rating:
          type: object
          required: [average, count]
          properties:
            average: { type: number, example: 4.5 }
            count: { type: integer, example: 2 }
    Pagination:
      type: object
      required: [limit, hasNextPage, nextCursor]
      properties:
        limit: { type: integer, example: 20 }
        hasNextPage: { type: boolean, example: true }
        nextCursor: { type: string, nullable: true }
    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: Invalid query parameter }
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
