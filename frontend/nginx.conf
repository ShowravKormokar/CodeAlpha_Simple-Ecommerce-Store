# Nginx configuration for the Simple E-commerce Store frontend container.
#
# Installed as /etc/nginx/conf.d/default.conf, so this is a `server` block that sits
# inside the stock nginx.conf.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server. Using a variable in proxy_pass (below) means the
    # hostname is resolved per request instead of once at startup, so nginx can start
    # before the backend container exists and keeps working after the backend
    # container is recreated with a new IP.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Same-origin API access.
    #
    # The browser cannot resolve the Docker service name `backend`, but nginx can.
    # This keeps `/api/...` on the same origin as the page, which means auth cookies
    # are sent as first-party and no CORS preflight is involved.
    #
    # `proxy_pass` has no URI part on purpose: the original request URI is passed
    # through unchanged, so /api/products stays /api/products. Stripping /api here
    # would break every route the backend mounts (/api/health, /api/products,
    # /api/auth, /api/orders).
    location /api/ {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Auth cookies must reach the client exactly as the backend sets them.
        proxy_pass_header Set-Cookie;
    }

    # HTML is re-checked on every visit so a rebuilt image is picked up immediately.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static assets can be cached; filenames are not content-hashed, so keep the
    # window short.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml;
}
