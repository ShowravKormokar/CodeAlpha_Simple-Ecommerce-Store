<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Simple E-commerce Store</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="nav-brand" href="index.html">Simple E-commerce Store</a>
      <ul class="nav-links" id="nav-links">
        </ul>
    </nav>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <h1>Login</h1>

      <div class="error-message" id="error-message" style="display: none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required />
        </div>

        <button type="submit" class="btn btn-primary" id="login-btn">Login</button>
      </form>

      <p class="auth-link">
        Don't have an account? <a href="register.html">Register</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Simple E-commerce Store</p>
  </footer>

  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/login.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
