<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Simple E-commerce Store</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="nav-brand" href="index.html">Simple E-commerce Store</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="register.html" class="active">Register</a></li>
        <li><a href="#" class="disabled">Cart</a></li>
      </ul>
    </nav>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <h1>Register</h1>

      <div class="error-message" id="error-message" style="display: none;"></div>
      <div class="success-message" id="success-message" style="display: none;"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" required />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password" autocomplete="new-password" required />
        </div>

        <button type="submit" class="btn btn-primary" id="register-btn">Register</button>
      </form>

      <p class="auth-link">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Simple E-commerce Store</p>
  </footer>

  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/register.js"></script>
</body>
</html>
